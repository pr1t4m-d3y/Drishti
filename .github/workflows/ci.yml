name: ci
on:
  pull_request:
  push:
    branches: [main]
env:
  DATABASE_URL: sqlite:///./ci.sqlite
  SESSION_DB_URL: sqlite+aiosqlite:///./ci_sessions.sqlite
  TRACE_EXPORTER: none

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy drishti ingest evals benchmarks
      - run: pytest --cov=drishti --cov=ingest --cov=evals --cov=benchmarks --cov-report=term
      - name: Build data + model for the eval smoke test
        run: |
          make data train load PY=python
          python -m evals.build_golden_set
      - name: Eval smoke test (offline guardrails, oracle SQL, injection scrub, retrieval)
        run: python -m evals.run --offline --check

  postgres:
    runs-on: ubuntu-latest
    services:
      pg:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: pgvector store contract + migrations + read-only role privileges
        run: pytest tests/test_store_contract.py -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (trains the model inside the build)
        run: docker build -t drishti:ci .
      - name: Container starts as non-root and answers /health
        run: |
          test "$(docker run --rm --entrypoint id drishti:ci -u)" != "0"
          docker run -d --name d -p 8080:8080 -e TRACE_EXPORTER=none drishti:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/health && break; sleep 2; done
          curl -fsS localhost:8080/health | grep '"status":"ok"'
          docker logs d | tail -5
      - name: Image size
        run: docker image ls drishti:ci --format '{{.Size}}'

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - working-directory: deploy/terraform
        run: |
          terraform fmt -recursive -check -diff || echo "::warning::run 'terraform fmt -recursive' in deploy/terraform"
          terraform init -backend=false
          terraform validate

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning scripts/*.sh deploy/*.sh
