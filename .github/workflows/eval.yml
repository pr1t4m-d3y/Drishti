name: eval (end-to-end, needs a Gemini key)
# Manual: Actions tab -> "eval" -> Run workflow.  One-time setup: repo Settings -> Secrets -> Actions ->
# add GOOGLE_API_KEY (https://aistudio.google.com/apikey). The key is only ever read from the secret store.
on:
  workflow_dispatch:
    inputs:
      judge: {description: "Also run the LLM-as-judge rubric", type: boolean, default: true}
env:
  DATABASE_URL: sqlite:///./eval.sqlite
  SESSION_DB_URL: sqlite+aiosqlite:///./eval_sessions.sqlite
  TRACE_EXPORTER: none
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Fail early if the key is missing
        run: test -n "$GOOGLE_API_KEY" || { echo "::error::add the GOOGLE_API_KEY repository secret"; exit 1; }
      - name: data, model, load, ingest, draft references
        run: |
          python -m drishti.pipeline --no-eval
          python -m evals.draft_references || true
      - name: baseline vs final
        run: |
          python -m evals.run --variant baseline --judge
          python -m evals.run --variant final --judge --check
          python -m evals.run --report
      - name: Summary
        run: cat evals/results/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
